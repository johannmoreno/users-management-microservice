<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vuelos Management</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <section id="view-login" class="login-wrap">
    <form id="login-form" class="card login-card" autocomplete="on">
      <div class="brand">
        <span class="brand-icon">✈️</span>
        <div>
          <h1>Vuelos Management</h1>
          <p class="muted">Gestión de vuelos · Arquitectura Hexagonal</p>
        </div>
      </div>

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required placeholder="admin@example.com" autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required minlength="8" placeholder="••••••••" autocomplete="current-password">

      <button id="login-btn" type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>

      <p id="login-error" class="alert alert-error hidden" role="alert"></p>

      <p class="muted small center">
        API documentada en <a href="/swagger-ui.html" target="_blank" rel="noopener">Swagger UI</a>
      </p>
    </form>
  </section>

  <!-- ================= APLICACIÓN ================= -->
  <section id="view-app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">✈️</span>
        <div>
          <strong>Vuelos Management</strong>
          <span id="user-chip" class="chip"></span>
        </div>
      </div>
      <nav class="topbar-actions">
        <a class="btn btn-ghost" href="/swagger-ui.html" target="_blank" rel="noopener">Swagger</a>
        <button id="logout-btn" class="btn btn-ghost" type="button">Cerrar sesión</button>
      </nav>
    </header>

    <main class="container">
      <div class="toolbar">
        <div>
          <h2>Vuelos</h2>
          <p id="role-note" class="muted small"></p>
        </div>
        <div class="toolbar-actions">
          <button id="refresh-btn" class="btn btn-ghost" type="button">Actualizar</button>
          <button id="new-btn" class="btn btn-primary admin-only" type="button">+ Nuevo vuelo</button>
        </div>
      </div>

      <p id="app-alert" class="alert hidden" role="status"></p>

      <div class="table-wrap">
        <table id="vuelos-table">
          <colgroup>
            <col style="width:8%">
            <col style="width:10%">
            <col style="width:13%">
            <col style="width:19%">
            <col style="width:12%">
            <col style="width:6%">
            <col style="width:11%">
            <col style="width:12%">
            <col style="width:9%">
          </colgroup>
          <thead>
            <tr>
              <th>Número</th>
              <th>Aerolínea</th>
              <th>Salida / llegada</th>
              <th>Ruta</th>
              <th>Cliente</th>
              <th>Puesto</th>
              <th class="right">Valor</th>
              <th>Estado</th>
              <th class="right">Acciones</th>
            </tr>
          </thead>
          <tbody id="vuelos-body"></tbody>
        </table>
        <p id="empty-state" class="empty hidden">No hay vuelos registrados todavía.</p>
      </div>
    </main>
  </section>

  <!-- ================= MODAL ================= -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">Nuevo vuelo</h3>
        <button id="modal-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
      </div>

      <form id="vuelo-form" class="grid">
        <div class="field" id="field-id">
          <label for="f-id">ID</label>
          <input id="f-id" required maxlength="36">
        </div>

        <div class="field">
          <label for="f-numero">Número de vuelo</label>
          <input id="f-numero" required pattern="[A-Z0-9]{2,10}" placeholder="AV9001"
                 title="2 a 10 caracteres: letras mayúsculas y números">
        </div>

        <div class="field">
          <label for="f-aerolinea">Aerolínea</label>
          <input id="f-aerolinea" required maxlength="100" placeholder="Avianca">
        </div>

        <div class="field">
          <label for="f-agencia">Agencia de viajes</label>
          <input id="f-agencia" required maxlength="100" placeholder="Agencia Caribe">
        </div>

        <div class="field">
          <label for="f-fecha-compra">Fecha de compra</label>
          <input id="f-fecha-compra" type="datetime-local" required>
        </div>

        <div class="field">
          <label for="f-fecha-salida">Fecha de salida</label>
          <input id="f-fecha-salida" type="datetime-local" required>
        </div>

        <div class="field">
          <label for="f-fecha-llegada">Fecha de llegada</label>
          <input id="f-fecha-llegada" type="datetime-local" required>
        </div>

        <div class="field">
          <label for="f-valor">Valor</label>
          <input id="f-valor" type="number" step="0.01" min="0.01" required placeholder="450000.00">
        </div>

        <div class="field">
          <label for="f-cliente">Cliente</label>
          <input id="f-cliente" required maxlength="100" placeholder="Carlos Perez">
        </div>

        <div class="field">
          <label for="f-puesto">Puesto</label>
          <input id="f-puesto" required pattern="[0-9]{1,2}[A-Z]" placeholder="12A"
                 title="Número de 1 o 2 dígitos seguido de una letra mayúscula">
        </div>

        <div class="field">
          <label for="f-avion">Avión</label>
          <input id="f-avion" required maxlength="50" placeholder="Airbus A320">
        </div>

        <div class="field">
          <label for="f-aeropuerto-salida">Aeropuerto de salida</label>
          <input id="f-aeropuerto-salida" required maxlength="100" placeholder="Aeropuerto Rafael Nunez">
        </div>

        <div class="field">
          <label for="f-aeropuerto-llegada">Aeropuerto de llegada</label>
          <input id="f-aeropuerto-llegada" required maxlength="100" placeholder="Aeropuerto El Dorado">
        </div>

        <div class="field">
          <label for="f-piloto">Piloto</label>
          <input id="f-piloto" required maxlength="100" placeholder="Capitan Juan Gomez">
        </div>

        <div class="field" id="field-estado">
          <label for="f-estado">Estado</label>
          <select id="f-estado">
            <option value="PROGRAMADO">PROGRAMADO</option>
            <option value="CONFIRMADO">CONFIRMADO</option>
            <option value="EN_VUELO">EN VUELO</option>
            <option value="ATERRIZADO">ATERRIZADO</option>
            <option value="CANCELADO">CANCELADO</option>
            <option value="RETRASADO">RETRASADO</option>
          </select>
        </div>

        <p id="form-error" class="alert alert-error hidden" role="alert"></p>

        <div class="modal-foot">
          <button id="cancel-btn" class="btn btn-ghost" type="button">Cancelar</button>
          <button id="save-btn" class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
